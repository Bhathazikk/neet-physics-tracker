<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEET Physics Master Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<style>
  input[type=number]{-moz-appearance:textfield}
  input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{opacity:1}
  button:disabled{opacity:.5;cursor:not-allowed}
  input,select,button{transition:background-color .15s,border-color .15s}
</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-3 md:p-8">

<div id="auth-screen" class="max-w-md mx-auto mt-8 md:mt-16 bg-slate-900 border border-slate-800 rounded-2xl p-6 md:p-8 shadow-xl">
  <div class="text-center mb-6">
    <div class="text-4xl mb-3">⚡</div>
    <h1 class="text-2xl font-black text-emerald-400">NEET Physics Dashboard</h1>
    <p class="text-sm text-slate-400 mt-2">Sign in to access your personal, cloud-saved progress.</p>
  </div>
  <div class="flex gap-2 mb-5">
    <button id="mode-login" onclick="setAuthMode('login')" class="flex-1 bg-emerald-500 text-slate-950 rounded-xl py-2 font-bold">Sign in</button>
    <button id="mode-signup" onclick="setAuthMode('signup')" class="flex-1 bg-slate-800 text-slate-300 rounded-xl py-2 font-bold">Create account</button>
  </div>
  <form id="auth-form" onsubmit="submitAuth(event)" class="space-y-4">
    <div id="name-wrap" class="hidden">
      <label class="block text-xs text-slate-400 mb-1">Your name (optional)</label>
      <input id="auth-name" type="text" autocomplete="name" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3" placeholder="Name">
    </div>
    <div>
      <label class="block text-xs text-slate-400 mb-1">Email</label>
      <input id="auth-email" type="email" autocomplete="email" required class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3" placeholder="you@example.com">
    </div>
    <div>
      <label class="block text-xs text-slate-400 mb-1">Password</label>
      <input id="auth-password" type="password" minlength="6" autocomplete="current-password" required class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3" placeholder="At least 6 characters">
    </div>
    <button id="auth-submit" type="submit" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 rounded-xl py-3 font-black">Sign in</button>
  </form>
  <button onclick="signInGoogle()" class="w-full mt-3 bg-slate-800 hover:bg-slate-700 rounded-xl py-3 font-bold">Continue with Google</button>
  <button id="forgot-btn" onclick="resetPassword()" class="w-full mt-3 text-sm text-sky-400 hover:text-sky-300">Forgot password?</button>
  <p id="auth-message" role="status" class="text-sm mt-4 text-center text-amber-300"></p>
  <p class="text-xs text-slate-500 mt-5 text-center">Each account has its own private progress. Use your own account on every device.</p>
</div>

<div id="app" class="hidden max-w-7xl mx-auto space-y-6">
  <header class="bg-slate-900 border border-slate-800 rounded-2xl p-5 md:p-6 shadow-xl space-y-4">
    <div class="flex flex-col lg:flex-row justify-between gap-5 items-start lg:items-center">
      <div>
        <h1 class="text-2xl md:text-3xl font-bold text-emerald-400">⚡ NEET Physics Master Dashboard</h1>
        <p class="text-slate-400 text-sm mt-1">Customizable activities • Chapter targets • Daily logs • Cloud sync</p>
        <p id="user-label" class="text-xs text-slate-500 mt-2"></p>
      </div>
      <div class="flex items-center gap-3">
        <span id="sync-status" class="text-xs text-emerald-300">Connecting…</span>
        <button onclick="signOutUser()" class="bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded-xl font-bold text-sm">Sign out</button>
      </div>
    </div>
    <div class="flex flex-wrap gap-2 border-t border-slate-800 pt-4">
      <button data-tab="net" onclick="switchView('net')" id="tab-net" class="px-4 py-2 rounded-xl font-bold text-sm bg-emerald-500 text-slate-950">📊 Net Dashboard</button>
      <button data-tab="daily" onclick="switchView('daily')" id="tab-daily" class="px-4 py-2 rounded-xl font-bold text-sm bg-slate-800 text-slate-400">📅 Daily Dashboard & Input</button>
      <button data-tab="monthly" onclick="switchView('monthly')" id="tab-monthly" class="px-4 py-2 rounded-xl font-bold text-sm bg-slate-800 text-slate-400">🗓️ Monthly Summary</button>
      <button data-tab="settings" onclick="switchView('settings')" id="tab-settings" class="px-4 py-2 rounded-xl font-bold text-sm bg-slate-800 text-slate-400">⚙️ Customize</button>
    </div>
  </header>
  <div id="view-container" class="space-y-6"></div>
</div>

<script>
"use strict";

// Keep this Firebase project configuration unchanged to use the same cloud project.
const firebaseConfig = {
  apiKey: "AIzaSyBLxMajJ8mUXTmhY_vCbsJoXtYaVcHmDOw",
  authDomain: "neet-physics-dashboard.firebaseapp.com",
  projectId: "neet-physics-dashboard",
  storageBucket: "neet-physics-dashboard.firebasestorage.app",
  messagingSenderId: "896252546261",
  appId: "1:896252546261:web:8baa3c7fc6c246528d265c",
  measurementId: "G-VZ9XLDRTY1"
};

const chapters = [
  ["Units and Measurements",11,11,181],
  ["Vectors & Mathematical Tools",21,21,42],
  ["Motion in a Straight Line (1D)",12,12,90],
  ["Motion in a Plane (2D)",11,11,87],
  ["Laws of Motion",16,16,146],
  ["Work, Energy and Power",9,9,103],
  ["Center of Mass (COM)",8,8,76],
  ["Rotational Motion",12,12,175],
  ["Gravitation",7,7,158],
  ["Mechanical Properties of Solids",4,4,71],
  ["Mechanical Properties of Fluids",11,11,135],
  ["Thermal Properties of Matter",9,9,71],
  ["Thermodynamics",5,5,107],
  ["Kinetic Theory of Gases (KTG)",3,3,111],
  ["Oscillations",7,7,105],
  ["Waves",6,6,77],
  ["Electric Charges and Fields",12,12,129],
  ["Electrostatic Potential and Capacitance",12,12,152],
  ["Current Electricity",12,12,231],
  ["Moving Charges and Magnetism",10,10,134],
  ["Magnetism and Matter",3,3,39],
  ["Electromagnetic Induction",4,4,112],
  ["Alternating Current",7,7,134],
  ["Electromagnetic Waves",2,2,114],
  ["Ray Optics and Optical Instruments",13,13,194],
  ["Wave Optics",5,5,102],
  ["Dual Nature of Radiation and Matter",2,2,158],
  ["Atoms",3,3,103],
  ["Nuclei",2,2,57],
  ["Semiconductor Electronics",5,5,140]
];

const TRACKS = {
  "NEET / Full Physics": {start:0,end:30},
  "JEE / Full Physics": {start:0,end:30},
  "Class 11 Medical": {start:0,end:16},
  "Class 12 Medical": {start:16,end:30}
};

function defaultActivities() {
  return [
    {id:"lec",name:"Lectures completed",type:"count",minutesPerUnit:120,questionsPerHour:15},
    {id:"rev",name:"Revision sessions",type:"count",minutesPerUnit:50,questionsPerHour:15},
    {id:"jee",name:"JEE Main PYQs",type:"questions",minutesPerUnit:0,questionsPerHour:15},
    {id:"neet",name:"NEET PYQs / chapter practice",type:"count",minutesPerUnit:120,questionsPerHour:15}
  ];
}

function defaultSettings() {
  return {
    track:"NEET / Full Physics",
    activities:defaultActivities(),
    chapters:chapters.map(c => ({
      name:c[0],
      targetHours:c[1]*2 + c[2]*(50/60) + c[3]/15 + 2
    }))
  };
}

let currentView = "net";
let dailyLogs = {};
let calendarDate = new Date();
let selectedCalendarDate = getTodayKey();
let currentUser = null;
let db = null;
let authMode = "login";
let saving = false;
let saveTimer = null;
let settings = defaultSettings();
let settingsLoaded = false;

function setSyncStatus(s,color="text-emerald-300") {
  const el=document.getElementById("sync-status");
  if(el){el.className="text-xs "+color;el.textContent=s;}
}

function setAuthMessage(s) {
  const el=document.getElementById("auth-message");
  if(el) el.textContent=s;
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function clamp(v,min,max) {
  v=Number(v);
  if(!Number.isFinite(v))v=0;
  return Math.max(min,Math.min(v,max));
}

function formatNumber(n) {
  return Number(n||0).toLocaleString("en-IN",{maximumFractionDigits:1});
}

function formatHours(n) {
  return `${Number(n||0).toFixed(1)} h`;
}

function percentage(done,total) {
  return total ? done/total*100 : 0;
}

function getTodayKey(customDate=new Date()) {
  const d=new Date(customDate);
  if(d.getHours()<3)d.setDate(d.getDate()-1);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}

function displayDate(key) {
  const d=new Date(key+"T12:00:00");
  return d.toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"});
}

function firebaseReady() {
  if(!firebaseConfig.apiKey || !firebaseConfig.projectId) {
    setAuthMessage("Firebase configuration is missing.");
    return false;
  }
  return true;
}

function setAuthMode(mode) {
  authMode=mode;
  const signup=mode==="signup";
  document.getElementById("name-wrap").classList.toggle("hidden",!signup);
  document.getElementById("auth-submit").textContent=signup?"Create account":"Sign in";
  document.getElementById("mode-login").className=(!signup?"flex-1 bg-emerald-500 text-slate-950":"flex-1 bg-slate-800 text-slate-300")+" rounded-xl py-2 font-bold";
  document.getElementById("mode-signup").className=(signup?"flex-1 bg-emerald-500 text-slate-950":"flex-1 bg-slate-800 text-slate-300")+" rounded-xl py-2 font-bold";
  document.getElementById("forgot-btn").classList.toggle("hidden",signup);
  setAuthMessage("");
}

function authError(err) {
  const map={
    "auth/email-already-in-use":"This email already has an account. Sign in instead.",
    "auth/invalid-email":"Please enter a valid email address.",
    "auth/weak-password":"Use a password with at least 6 characters.",
    "auth/user-not-found":"No account found for this email. Create an account first.",
    "auth/wrong-password":"Incorrect email or password.",
    "auth/invalid-credential":"Incorrect email or password.",
    "auth/popup-closed-by-user":"Google sign-in was cancelled.",
    "auth/unauthorized-domain":"Add this website domain in Firebase Authentication → Settings → Authorized domains."
  };
  return map[err.code] || ("Could not complete request: "+(err.message||err.code||"Unknown error"));
} async function submitAuth(e) {
  e.preventDefault();
  if(!firebaseReady())return;
  const email=document.getElementById("auth-email").value.trim();
  const password=document.getElementById("auth-password").value;
  const btn=document.getElementById("auth-submit");
  btn.disabled=true;
  setAuthMessage("Please wait…");
  try {
    if(authMode==="signup") {
      const cred=await firebase.auth().createUserWithEmailAndPassword(email,password);
      const name=document.getElementById("auth-name").value.trim();
      if(name)await cred.user.updateProfile({displayName:name});
    } else {
      await firebase.auth().signInWithEmailAndPassword(email,password);
    }
    setAuthMessage("");
  } catch(err) {
    setAuthMessage(authError(err));
  } finally {
    btn.disabled=false;
  }
}

async function signInGoogle() {
  if(!firebaseReady())return;
  try {
    await firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider());
  } catch(err) {
    setAuthMessage(authError(err));
  }
}

async function resetPassword() {
  if(!firebaseReady())return;
  const email=document.getElementById("auth-email").value.trim();
  if(!email) {
    setAuthMessage("Enter your email first, then tap Forgot password.");
    return;
  }
  try {
    await firebase.auth().sendPasswordResetEmail(email);
    setAuthMessage("Password reset email sent. Check your inbox.");
  } catch(err) {
    setAuthMessage(authError(err));
  }
}

async function signOutUser() {
  try {
    await firebase.auth().signOut();
  } catch(err) {
    alert(authError(err));
  }
}

function getUserDoc() {
  return db.collection("users").doc(currentUser.uid)
    .collection("privateData").doc("physicsDashboard");
}

function normalizeSettings(saved) {
  const base=defaultSettings();
  if(!saved || typeof saved!=="object")return base;

  const track=TRACKS[saved.track]?saved.track:base.track;
  const activitySource=Array.isArray(saved.activities)&&saved.activities.length
    ? saved.activities
    : base.activities;

  const activities=activitySource.slice(0,12).map((a,i)=>({
    id:String(a.id||("custom_"+i))
      .replace(/[^a-zA-Z0-9_-]/g,"_").slice(0,50),
    name:String(a.name||"Activity").slice(0,60),
    type:["hours","questions","count"].includes(a.type)?a.type:"count",
    minutesPerUnit:Math.max(0,Number(a.minutesPerUnit)||0),
    questionsPerHour:Math.max(1,Number(a.questionsPerHour)||15)
  }));

  const savedChapters=Array.isArray(saved.chapters)?saved.chapters:[];
  const normalizedChapters=base.chapters.map((c,i)=>({
    name:String(savedChapters[i]?.name||c.name).slice(0,100),
    targetHours:Math.max(
      0,
      Number.isFinite(Number(savedChapters[i]?.targetHours))
        ? Number(savedChapters[i].targetHours)
        : c.targetHours
    )
  }));

  return {
    track,
    activities:activities.length?activities:base.activities,
    chapters:normalizedChapters
  };
}

function normalizeLogs(value) {
  if(!value || typeof value!=="object" || Array.isArray(value))return {};
  const out={};

  Object.keys(value).forEach(date=>{
    if(!/^\d{4}-\d{2}-\d{2}$/.test(date) ||
       !value[date] || typeof value[date]!=="object")return;

    out[date]={};

    Object.keys(value[date]).forEach(index=>{
      const i=Number(index);
      const entry=value[date][index];

      if(!Number.isInteger(i)||i<0||i>=chapters.length||
         !entry||typeof entry!=="object")return;

      const clean={};

      Object.keys(entry).forEach(id=>{
        const v=entry[id];
        if(typeof v==="boolean") {
          if(v)clean[id]=true;
        } else if(Number.isFinite(Number(v))&&Number(v)>0) {
          clean[id]=Number(v);
        }
      });

      if(Object.keys(clean).length)out[date][i]=clean;
    });

    if(!Object.keys(out[date]).length)delete out[date];
  });

  return out;
}

async function handleUser(user) {
  currentUser=user;

  if(!user) {
    document.getElementById("app").classList.add("hidden");
    document.getElementById("auth-screen").classList.remove("hidden");
    dailyLogs={};
    settings=defaultSettings();
    settingsLoaded=false;
    return;
  }

  document.getElementById("auth-screen").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  document.getElementById("user-label").textContent=
    "Signed in as "+(user.displayName||user.email||"your account");

  setSyncStatus("Loading cloud data…","text-amber-300");

  try {
    const snap=await getUserDoc().get();
    const saved=snap.exists?snap.data():{};

    dailyLogs=normalizeLogs(saved.dailyLogs);
    settings=normalizeSettings(saved.dashboardSettings);
    settingsLoaded=true;

    selectedCalendarDate=getTodayKey();
    calendarDate=new Date();

    setSyncStatus("Cloud synced");
    render();
  } catch(err) {
    setSyncStatus("Cloud load failed","text-red-300");
    document.getElementById("view-container").innerHTML=`
      <div class="bg-red-950/40 border border-red-800 rounded-xl p-5">
        Could not load your cloud data. Check your internet connection and
        Firestore security rules, then try signing in again.
        <div class="text-xs mt-2 text-red-200">
          ${escapeHtml(err.message||"")}
        </div>
      </div>`;
  }
}

async function saveData() {
  if(!currentUser||!db)
    throw new Error("You are signed out. Sign in again before saving.");

  saving=true;
  setSyncStatus("Saving…","text-amber-300");

  try {
    await getUserDoc().set({
      dailyLogs,
      dashboardSettings:settings,
      updatedAt:firebase.firestore.FieldValue.serverTimestamp()
    },{merge:true});

    setSyncStatus("Saved to cloud");
  } catch(err) {
    setSyncStatus("Save failed","text-red-300");
    throw err;
  } finally {
    saving=false;
  }
}

function queueSave() {
  if(saveTimer)clearTimeout(saveTimer);
  setSyncStatus("Changes pending…","text-amber-300");

  saveTimer=setTimeout(async()=>{
    try {
      await saveData();
    } catch(err) {
      console.error(err);
      setSyncStatus("Save failed — retry","text-red-300");
    }
  },500);
}

function saveImmediately() {
  return saveData();
}

// Activity values in the legacy log remain compatible: lec, rev, jee, neet.
function getActivityValue(entry,activity) {
  const value=entry ? entry[activity.id] : 0;
  return activity.type==="hours"
    ? Math.max(0,Number(value)||0)
    : (activity.id==="neet"
        ? (value===true?1:Math.max(0,Number(value)||0))
        : Math.max(0,Number(value)||0));
}

function activityHours(value,activity) {
  value=Number(value)||0;
  if(activity.type==="hours")return value;
  if(activity.type==="questions")
    return value/(Number(activity.questionsPerHour)||1);
  return value*(Number(activity.minutesPerUnit)||0)/60;
}

function chapterHoursFromEntry(entry) {
  return settings.activities.reduce(
    (sum,a)=>sum+activityHours(getActivityValue(entry,a),a),0
  );
}

function chapterTotals(index,{beforeToday=false,month=null}={}) {
  const total={};
  const today=getTodayKey();

  Object.keys(dailyLogs).forEach(date=>{
    if(beforeToday && date>=today)return;
    if(month && !date.startsWith(month))return;

    const entry=dailyLogs[date]?.[index];
    if(!entry)return;

    settings.activities.forEach(a=>{
      total[a.id]=(total[a.id]||0)+getActivityValue(entry,a);
    });
  });

  return total;
}

function getChapterHours(index,options={}) {
  return Object.keys(dailyLogs).reduce((sum,date)=>{
    if(options.beforeToday && date>=getTodayKey())return sum;
    if(options.month && !date.startsWith(options.month))return sum;
    return sum+chapterHoursFromEntry(dailyLogs[date]?.[index]);
  },0);
}

function getVisibleChapterIndices() {
  const t=TRACKS[settings.track]||TRACKS["NEET / Full Physics"];
  return Array.from({length:t.end-t.start},(_,i)=>t.start+i);
}

function getActivityTarget(index,activity) {
  const c=chapters[index];
  if(activity.id==="lec")return c[1];
  if(activity.id==="rev")return c[2];
  if(activity.id==="jee")return c[3];
  if(activity.id==="neet")return 1;
  return 0;
}

function getTargetHours(index) {
  return Math.max(0,Number(settings.chapters[index]?.targetHours)||0);
}

function getTodayEntry(index,date=selectedCalendarDate) {
  return dailyLogs[date]?.[index]||{};
}

function render() {
  if(!currentUser)return;

  const container=document.getElementById("view-container");

  if(currentView==="net")container.innerHTML=renderNetDashboard();
  else if(currentView==="daily")container.innerHTML=renderDailyDashboard();
  else if(currentView==="monthly")container.innerHTML=renderMonthlyDashboard();
  else if(currentView==="settings")container.innerHTML=renderSettings();

  ["net","daily","monthly","settings"].forEach(v=>{
    const b=document.getElementById("tab-"+v);
    if(!b)return;

    b.className="px-4 py-2 rounded-xl font-bold text-sm "+
      (v===currentView
        ?"bg-emerald-500 text-slate-950"
        :"bg-slate-800 text-slate-400 hover:text-white");
  });
}

function switchView(view) {
  if(!["net","daily","monthly","settings"].includes(view))return;
  currentView=view;
  render();
}

function renderNetDashboard() {
  const indices=getVisibleChapterIndices();
  const totalTarget=indices.reduce((s,i)=>s+getTargetHours(i),0);
  const completed=indices.reduce(
    (s,i)=>s+getChapterHours(i,{beforeToday:true}),0
  );
  const pct=totalTarget?completed/totalTarget*100:0;

  const chapterRows=indices.map((i,local)=> {
    const hours=getChapterHours(i,{beforeToday:true});
    const target=getTargetHours(i);
    const p=target?Math.min(100,hours/target*100):0;
    const c=settings.chapters[i];

    return `<tr class="hover:bg-slate-800/45 border-t border-slate-800/70">
      <td class="p-3 text-center text-slate-500">${local+1}</td>
      <td class="p-3 font-medium">${escapeHtml(c.name)}</td>
      <td class="p-3 whitespace-nowrap">${formatHours(hours)}</td>
      <td class="p-3 whitespace-nowrap">${formatHours(target)}</td>
      <td class="p-3 min-w-[150px]">
        <div class="flex items-center gap-2">
          <div class="h-2 bg-slate-800 rounded-full flex-1 overflow-hidden">
            <div class="h-full bg-emerald-400" style="width:${p}%"></div>
          </div>
          <span class="text-xs w-10 text-right">${p.toFixed(0)}%</span>
        </div>
      </td>
    </tr>`;
  }).join("");

  const activityCards=settings.activities.map(a=>{
    let done=0;
    indices.forEach(i=>done+=chapterTotals(i,{beforeToday:true})[a.id]||0);

    return `<div class="bg-slate-900 border border-slate-800 rounded-2xl p-4">
      <div class="text-xs text-slate-400 uppercase font-bold">${escapeHtml(a.name)}</div>
      <div class="text-2xl font-black text-emerald-400 mt-2">${formatNumber(done)}</div>
      <div class="text-xs text-slate-500 mt-1">${
        a.type==="hours"?"hours":a.type==="questions"?"questions":"units logged"
      }</div>
    </div>`;
  }).join("");

  const doneChapters=indices.filter(
    i=>getTargetHours(i)>0&&
      getChapterHours(i,{beforeToday:true})>=getTargetHours(i)
  ).length;

  return `
    <div class="bg-gradient-to-r from-emerald-500/20 via-slate-900 to-sky-500/20 border border-emerald-500/30 rounded-2xl p-5 md:p-7">
      <div class="flex flex-col md:flex-row md:justify-between gap-5">
        <div>
          <div class="text-sm uppercase tracking-widest font-bold text-emerald-400">
            OVERALL PREPARATION · ${escapeHtml(settings.track)}
          </div>
          <div class="text-5xl md:text-6xl font-black mt-2">${pct.toFixed(1)}%</div>
          <div class="text-slate-400 mt-2">
            ${completed.toFixed(1)} study-equivalent hours / ${totalTarget.toFixed(1)} target hours
          </div>
        </div>
        <div class="md:w-1/2">
          <div class="flex justify-between text-sm mb-2">
            <span class="text-slate-400">Progress before today's study day</span>
            <b class="text-emerald-400">${pct.toFixed(1)}%</b>
          </div>
          <div class="h-5 bg-slate-800 rounded-full overflow-hidden">
            <div class="h-full bg-emerald-400" style="width:${Math.min(100,pct)}%"></div>
          </div>
          <div class="text-xs text-slate-500 mt-2">
            ${Math.max(0,totalTarget-completed).toFixed(1)} target hours remaining ·
            ${doneChapters}/${indices.length} chapters at target
          </div>
        </div>
      </div>
    </div>
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-3">${activityCards}</div>
    <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden">
      <div class="p-5 border-b border-slate-800 flex flex-wrap items-center justify-between gap-3">
        <div>
          <h2 class="font-bold text-lg text-emerald-400">📚 Chapter progress</h2>
          <p class="text-xs text-slate-500 mt-1">
            Progress is calculated from your logged activities and editable target hours.
          </p>
        </div>
        <button onclick="switchView('settings')" class="bg-slate-800 hover:bg-slate-700 px-3 py-2 rounded-xl text-sm font-bold">Customize</button>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm min-w-[650px]">
          <thead><tr class="bg-slate-800/60 text-slate-300 uppercase text-xs">
            <th class="p-3 text-center">#</th><th class="p-3">Chapter</th>
            <th class="p-3">Completed</th><th class="p-3">Target</th>
            <th class="p-3">Progress</th>
          </tr></thead>
          <tbody>${chapterRows}</tbody>
        </table>
      </div>
    </div>`;
  } function changeMonth(n) {
  calendarDate.setMonth(calendarDate.getMonth()+n);
  render();
}

function selectDay(date) {
  selectedCalendarDate=date;
  render();
}

function renderDailyDashboard() {
  const y=calendarDate.getFullYear(),m=calendarDate.getMonth();
  const monthName=calendarDate.toLocaleDateString(undefined,{month:"long",year:"numeric"});
  const today=getTodayKey();
  const names=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  let cells="";

  for(let i=0;i<new Date(y,m,1).getDay();i++)
    cells+='<div class="min-h-[76px] rounded-xl bg-slate-950/40"></div>';

  for(let day=1;day<=new Date(y,m+1,0).getDate();day++){
    const key=`${y}-${String(m+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
    const selected=key===selectedCalendarDate;
    const isToday=key===today;
    const entries=Object.values(dailyLogs[key]||{});
    const hrs=entries.reduce((s,e)=>s+chapterHoursFromEntry(e),0);

    cells+=`<button ${key>today?'disabled':''} onclick="selectDay('${key}')" class="text-left bg-slate-950 border ${selected?"border-emerald-400 ring-2 ring-emerald-400/30":isToday?"border-sky-500/60":"border-slate-800"} rounded-xl p-2 min-h-[76px] hover:border-emerald-400">
      <span class="text-xs font-bold ${isToday?"text-sky-400":"text-slate-400"}">${day}</span>
      <div class="mt-2 text-[11px] ${hrs?"text-emerald-400":"text-slate-600"}">${hrs?hrs.toFixed(1)+" h":"-"}</div>
    </button>`;
  }

  const entries=dailyLogs[selectedCalendarDate]||{};
  const isPast=selectedCalendarDate<today;
  const isFuture=selectedCalendarDate>today;
  const indices=getVisibleChapterIndices();

  const chapterOptions=indices.map(i=>
    `<option value="${i}">${i+1}. ${escapeHtml(settings.chapters[i].name)}</option>`
  ).join("");

  const logged=Object.keys(entries).map(k=>{
    const i=Number(k),entry=entries[k];
    if(!Number.isInteger(i)||!chapters[i])return "";

    const pills=settings.activities.map(a=>
      `<span>${escapeHtml(a.name)}: <b class="text-white">${formatNumber(getActivityValue(entry,a))}</b></span>`
    ).join("");

    return `<div class="bg-slate-950 border border-slate-800 rounded-xl p-4 flex flex-col md:flex-row md:justify-between gap-3">
      <div>
        <b>${i+1}. ${escapeHtml(settings.chapters[i].name)}</b>
        <div class="flex flex-wrap gap-3 text-xs text-slate-400 mt-2">${pills}</div>
        <div class="text-xs text-emerald-300 mt-2">Equivalent: ${formatHours(chapterHoursFromEntry(entry))}</div>
      </div>
      ${!isPast&&!isFuture?`<button onclick="removeChapterLog(${i})" class="self-start bg-red-500/20 text-red-300 px-3 py-2 rounded-lg text-xs font-bold">Remove</button>`:""}
    </div>`;
  }).join("");

  const activityInputs=settings.activities.map(a=>
    `<div>
      <label class="block text-xs text-slate-400 mb-1">
        ${escapeHtml(a.name)}${a.type==="hours"?" (hours)":a.type==="questions"?" (questions)":" (units)"}
      </label>
      <input type="number" id="activity_${escapeHtml(a.id)}" min="0"
        step="${a.type==="hours"?"0.25":"1"}" value="0"
        class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3">
    </div>`
  ).join("");

  return `
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 flex flex-col md:flex-row md:justify-between gap-4">
      <div>
        <h2 class="text-lg font-bold text-emerald-400">📅 Daily Dashboard & Input Hub</h2>
        <p class="text-xs text-slate-500 mt-1">Choose a date and log completed work. Past study days are read-only.</p>
      </div>
      <div class="flex items-center gap-3">
        <button onclick="changeMonth(-1)" class="text-emerald-400 font-bold px-2">←</button>
        <b>${monthName}</b>
        <button onclick="changeMonth(1)" class="text-emerald-400 font-bold px-2">→</button>
      </div>
    </div>

    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 md:p-6">
      <div class="grid grid-cols-7 gap-2 text-center mb-3">
        ${names.map(n=>`<div class="text-xs font-bold text-slate-500">${n}</div>`).join("")}
      </div>
      <div class="grid grid-cols-7 gap-2">${cells}</div>
      <p class="text-xs text-slate-500 mt-3">
        The study day changes at 3:00 AM local time. Only today and earlier dates are shown; past days cannot be edited.
      </p>
    </div>

    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-5">
      <div>
        <h2 class="font-bold text-lg text-emerald-400">✍️ Log work: ${displayDate(selectedCalendarDate)}</h2>
        <p class="text-xs text-slate-500 mt-1">
          ${isPast?"🔒 This study day is locked.":isFuture?"Future dates cannot be edited.":"Select a chapter and enter today's work."}
        </p>
      </div>

      ${!isPast&&!isFuture?`
        <form onsubmit="saveChapterLog(event)" class="space-y-4 bg-slate-950 p-4 md:p-5 rounded-xl border border-slate-800">
          <div>
            <label class="block text-xs uppercase font-bold text-slate-400 mb-2">Select chapter</label>
            <select id="select-chapter" required class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3">
              <option value="">-- Choose chapter --</option>${chapterOptions}
            </select>
          </div>
          <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">${activityInputs}</div>
          <button id="save-log-btn" type="submit" class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold px-5 py-3 rounded-xl">Save chapter log</button>
        </form>`:""}

      <div class="space-y-3">
        <h3 class="text-sm font-bold uppercase text-slate-400">Chapters logged on this date</h3>
        ${logged||'<div class="text-slate-500 text-sm bg-slate-950 p-4 rounded-xl border border-slate-800">No chapters logged for this date yet.</div>'}
      </div>
    </div>`;
}

async function saveChapterLog(e) {
  e.preventDefault();
  if(saving)return;

  if(selectedCalendarDate!==getTodayKey()){
    alert("Only the current study day can be edited.");
    return;
  }

  const idx=Number(document.getElementById("select-chapter").value);

  if(!Number.isInteger(idx)||!getVisibleChapterIndices().includes(idx)){
    alert("Please select a valid chapter.");
    return;
  }

  const entry={...(dailyLogs[selectedCalendarDate]?.[idx]||{})};

  settings.activities.forEach(a=>{
    let v=Number(document.getElementById("activity_"+a.id)?.value)||0;
    if(a.type==="hours")v=Math.max(0,v);
    else v=Math.max(0,Math.floor(v));

    if(v===0)delete entry[a.id];
    else entry[a.id]=v;
  });

  // Keep legacy NEET checkbox values compatible with the old dashboard.
  if(entry.neet===1)entry.neet=true;

  const old=JSON.parse(JSON.stringify(dailyLogs));

  if(!dailyLogs[selectedCalendarDate])
    dailyLogs[selectedCalendarDate]={};

  if(Object.keys(entry).length)
    dailyLogs[selectedCalendarDate][idx]=entry;
  else
    delete dailyLogs[selectedCalendarDate][idx];

  if(!Object.keys(dailyLogs[selectedCalendarDate]).length)
    delete dailyLogs[selectedCalendarDate];

  const btn=document.getElementById("save-log-btn");
  if(btn)btn.disabled=true;

  try {
    await saveData();
    render();
  } catch(err) {
    dailyLogs=old;
    render();
    alert("Cloud save failed. Your change was rolled back. Check your connection and Firebase rules.\n"+(err.message||""));
  } finally {
    const b=document.getElementById("save-log-btn");
    if(b)b.disabled=false;
  }
}

async function removeChapterLog(idx) {
  if(saving)return;

  if(selectedCalendarDate!==getTodayKey()){
    alert("Only today's study log can be changed.");
    return;
  }

  if(!confirm("Remove this chapter's log for today?"))return;

  const old=JSON.parse(JSON.stringify(dailyLogs));

  if(dailyLogs[selectedCalendarDate]) {
    delete dailyLogs[selectedCalendarDate][idx];
    if(!Object.keys(dailyLogs[selectedCalendarDate]).length)
      delete dailyLogs[selectedCalendarDate];
  }

  try {
    await saveData();
    render();
  } catch(err) {
    dailyLogs=old;
    render();
    alert("Could not save removal. Your local change was rolled back.");
  }
}

function renderMonthlyDashboard() {
  const months={};

  Object.keys(dailyLogs).forEach(date=>{
    const key=date.slice(0,7);

    if(!months[key])
      months[key]={hours:0,days:new Set(),activities:{}};

    months[key].days.add(date);

    Object.values(dailyLogs[date]||{}).forEach(entry=>{
      months[key].hours+=chapterHoursFromEntry(entry);

      settings.activities.forEach(a=>{
        months[key].activities[a.id]=
          (months[key].activities[a.id]||0)+getActivityValue(entry,a);
      });
    });
  });

  const keys=Object.keys(months).sort().reverse();

  if(!keys.length)
    return `<div class="bg-slate-900 border border-slate-800 rounded-2xl p-8 text-center">
      <h2 class="text-xl font-bold text-emerald-400">No monthly activity logged yet</h2>
      <p class="text-slate-400 text-sm mt-2">Add entries in Daily Dashboard to see your summary.</p>
    </div>`;

  return `
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5">
      <h2 class="text-lg font-bold text-emerald-400">🗓️ Monthly Summary</h2>
      <p class="text-xs text-slate-500 mt-1">Monthly totals are calculated from your saved daily logs.</p>
    </div>
    <div class="grid md:grid-cols-2 gap-4">
      ${keys.map(key=>{
        const s=months[key];
        const label=new Date(key+"-15T12:00:00").toLocaleDateString(
          undefined,{month:"long",year:"numeric"}
        );

        return `<div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4">
          <div class="flex justify-between items-center border-b border-slate-800 pb-2">
            <span class="font-bold text-emerald-400 text-lg">${label}</span>
            <span class="text-xs text-slate-400">${s.days.size} active days</span>
          </div>
          <div class="text-3xl font-black">${s.hours.toFixed(1)}
            <span class="text-sm font-normal text-slate-400">equivalent hours</span>
          </div>
          <div class="grid grid-cols-2 gap-3 text-sm">
            ${settings.activities.map(a=>`
              <div class="bg-slate-950 p-3 rounded-xl">
                <div class="text-xs text-slate-500">${escapeHtml(a.name)}</div>
                <div class="text-lg font-bold">${formatNumber(s.activities[a.id]||0)}</div>
              </div>`).join("")}
          </div>
        </div>`;
      }).join("")}
    </div>`;
}

function renderSettings() {
  const activityHtml=settings.activities.map((a,i)=>`
    <div class="border border-slate-800 bg-slate-950 rounded-xl p-4 space-y-3">
      <div class="flex justify-between items-center">
        <b>Activity ${i+1}</b>
        <button type="button" onclick="removeActivity('${escapeHtml(a.id)}')" class="text-sm text-red-300 hover:text-red-200">Remove</button>
      </div>

      <label class="block text-xs text-slate-400">
        Column name
        <input id="activity-name-${escapeHtml(a.id)}" maxlength="60" value="${escapeHtml(a.name)}" class="block w-full mt-1 bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm">
      </label>

      <label class="block text-xs text-slate-400">
        Value type
        <select id="activity-type-${escapeHtml(a.id)}" onchange="toggleActivitySetting('${escapeHtml(a.id)}')" class="block w-full mt-1 bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm">
          <option value="count" ${a.type==="count"?"selected":""}>Count / units</option>
          <option value="questions" ${a.type==="questions"?"selected":""}>Questions</option>
          <option value="hours" ${a.type==="hours"?"selected":""}>Hours</option>
        </select>
      </label>

      <div id="activity-conversion-${escapeHtml(a.id)}" class="${a.type==="hours"?"hidden":""} grid sm:grid-cols-2 gap-3">
        <label class="block text-xs text-slate-400 ${a.type==="count"?"":"hidden"}" id="minutes-label-${escapeHtml(a.id)}">
          Minutes per unit
          <input id="activity-minutes-${escapeHtml(a.id)}" type="number" min="0" step="1" value="${a.minutesPerUnit}" class="block w-full mt-1 bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm">
        </label>

        <label class="block text-xs text-slate-400 ${a.type==="questions"?"":"hidden"}" id="rate-label-${escapeHtml(a.id)}">
          Questions equivalent to one hour
          <input id="activity-rate-${escapeHtml(a.id)}" type="number" min="1" step="1" value="${a.questionsPerHour}" class="block w-full mt-1 bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm">
        </label>
      </div>

      <p class="text-xs text-slate-500">This activity's conversion is used to calculate equivalent study hours.</p>
    </div>`).join("");

  const chapterHtml=getVisibleChapterIndices().map(i=>`
    <div class="grid grid-cols-1 sm:grid-cols-[1fr_150px] gap-3 py-3 border-b border-slate-800">
      <label class="block text-xs text-slate-400">
        Chapter name
        <input id="chapter-name-${i}" maxlength="100" value="${escapeHtml(settings.chapters[i].name)}" class="block w-full mt-1 bg-slate-950 border border-slate-700 rounded-xl p-3 text-sm">
      </label>
      <label class="block text-xs text-slate-400">
        Target hours
        <input id="chapter-target-${i}" type="number" min="0" step="0.5" value="${settings.chapters[i].targetHours}" class="block w-full mt-1 bg-slate-950 border border-slate-700 rounded-xl p-3 text-sm">
      </label>
    </div>`).join("");

  return `<div class="space-y-5">
    <section class="bg-slate-900 border border-slate-800 rounded-2xl p-5">
      <h2 class="text-xl font-bold text-emerald-400">⚙️ Customize your dashboard</h2>
      <p class="text-sm text-slate-400 mt-1">Your preferences are saved in your existing Firebase account document.</p>

      <label class="block mt-5 text-sm font-bold">
        Study track
        <select id="track-select" onchange="changeTrack(this.value)" class="block w-full mt-2 bg-slate-950 border border-slate-700 rounded-xl p-3">
          ${Object.keys(TRACKS).map(t=>`<option value="${escapeHtml(t)}" ${settings.track===t?"selected":""}>${escapeHtml(t)}</option>`).join("")}
        </select>
      </label>

      <p class="text-xs text-slate-500 mt-2">Changing the track changes which chapters are displayed. The original 30 chapter indices and daily logs are retained.</p>
    </section>

    <section class="bg-slate-900 border border-slate-800 rounded-2xl p-5">
      <div class="flex flex-wrap items-start justify-between gap-3">
        <div>
          <h2 class="text-lg font-bold">Activity columns</h2>
          <p class="text-sm text-slate-400 mt-1">Rename existing columns or add your own. Removing a column hides its values from calculations but does not erase old log fields.</p>
        </div>
        <button onclick="addActivity()" class="bg-emerald-500 text-slate-950 rounded-xl px-4 py-2 font-bold text-sm">+ Add activity</button>
      </div>

      <div class="space-y-4 mt-4">${activityHtml}</div>
      <button onclick="saveActivitySettings()" class="mt-5 bg-emerald-500 text-slate-950 rounded-xl px-5 py-3 font-bold">Save activity settings</button>
    </section>

    <section class="bg-slate-900 border border-slate-800 rounded-2xl p-5">
      <h2 class="text-lg font-bold">Chapter names and targets</h2>
      <p class="text-sm text-slate-400 mt-1">Change names and the target number of study-equivalent hours.</p>
      <div class="mt-3">${chapterHtml}</div>
      <button onclick="saveChapterSettings()" class="mt-5 bg-emerald-500 text-slate-950 rounded-xl px-5 py-3 font-bold">Save chapter settings</button>
    </section>

    <section class="bg-slate-900 border border-slate-800 rounded-2xl p-5">
      <h2 class="font-bold">Cloud data</h2>
      <p class="text-sm text-slate-400 mt-1">This dashboard uses the existing Firebase project and the same per-user document path as your original dashboard.</p>
      <button onclick="manualSave()" class="mt-4 bg-slate-800 hover:bg-slate-700 rounded-xl px-4 py-2 font-bold">Save all changes now</button>
    </section>
  </div>`;
}

function toggleActivitySetting(id) {
  const type=document.getElementById("activity-type-"+id)?.value;
  const conv=document.getElementById("activity-conversion-"+id);
  const min=document.getElementById("minutes-label-"+id);
  const rate=document.getElementById("rate-label-"+id);

  if(conv)conv.classList.toggle("hidden",type==="hours");
  if(min)min.classList.toggle("hidden",type!=="count");
  if(rate)rate.classList.toggle("hidden",type!=="questions");
}

function addActivity() {
  if(settings.activities.length>=12) {
    alert("You can have up to 12 activity columns.");
    return;
  }

  let id="custom_"+Date.now().toString(36);
  while(settings.activities.some(a=>a.id===id))id+="_x";

  settings.activities.push({
    id,
    name:"New activity",
    type:"count",
    minutesPerUnit:0,
    questionsPerHour:15
  });

  render();
}

function removeActivity(id) {
  if(settings.activities.length<=1) {
    alert("Keep at least one activity.");
    return;
  }

  if(!confirm("Remove this activity from the dashboard? Existing log values are not deleted."))return;

  settings.activities=settings.activities.filter(a=>a.id!==id);
  render();
  queueSave();
}

async function saveActivitySettings() {
  const updated=[];

  for(const a of settings.activities) {
    const name=document.getElementById("activity-name-"+a.id)?.value.trim();
    const type=document.getElementById("activity-type-"+a.id)?.value;
    const minutesPerUnit=Number(document.getElementById("activity-minutes-"+a.id)?.value)||0;
    const questionsPerHour=Number(document.getElementById("activity-rate-"+a.id)?.value)||15;

    if(!name) {
      alert("Every activity needs a name.");
      return;
    }

    if(!["count","questions","hours"].includes(type)) {
      alert("Choose a valid activity type.");
      return;
    }

    if(minutesPerUnit<0||questionsPerHour<=0) {
      alert("Please enter valid conversion values.");
      return;
    }

    updated.push({...a,name,type,minutesPerUnit,questionsPerHour});
  }

  settings.activities=updated;

  try {
    await saveData();
    render();
    alert("Activity settings saved.");
  } catch(err) {
    alert("Could not save settings: "+(err.message||"Check your connection."));
  }
}

async function saveChapterSettings() {
  const next=settings.chapters.map(c=>({...c}));

  for(const i of getVisibleChapterIndices()) {
    const name=document.getElementById("chapter-name-"+i)?.value.trim();
    const target=Number(document.getElementById("chapter-target-"+i)?.value);

    if(!name) {
      alert("Every chapter needs a name.");
      return;
    }

    if(!Number.isFinite(target)||target<0) {
      alert("Target hours must be zero or greater.");
      return;
    }

    next[i]={name,targetHours:target};
  }

  settings.chapters=next;

  try {
    await saveData();
    render();
    alert("Chapter settings saved.");
  } catch(err) {
    alert("Could not save settings: "+(err.message||"Check your connection."));
  }
}

async function changeTrack(track) {
  if(!TRACKS[track])return;

  settings.track=track;
  render();

  try {
    await saveData();
  } catch(err) {
    alert("Track changed locally, but cloud save failed: "+(err.message||""));
  }
}

async function manualSave() {
  try {
    await saveData();
    alert("Your dashboard data and settings are saved to Firebase.");
  } catch(err) {
    alert("Save failed: "+(err.message||"Check your internet connection and Firebase rules."));
  }
}

db=firebase.firestore();

firebase.auth().onAuthStateChanged(user=>{
  handleUser(user).catch(err=>{
    console.error(err);
    setSyncStatus("Could not load data","text-red-300");
  });
});

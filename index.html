<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NEET Physics Master Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

<style>
    input[type=number] {
        -moz-appearance: textfield;
    }

    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button {
        opacity: 1;
    }
</style>
</head>

<body class="bg-slate-950 text-slate-100 min-h-screen p-3 md:p-8">

<div class="max-w-7xl mx-auto space-y-6">

<!-- =====================================================
     HEADER & VIEW SELECTOR
===================================================== -->

<header class="bg-slate-900 border border-slate-800 rounded-2xl p-5 md:p-6 shadow-xl space-y-4">

    <div class="flex flex-col lg:flex-row justify-between gap-5 items-start lg:items-center">

        <div>
            <h1 class="text-2xl md:text-3xl font-bold text-emerald-400">
                ⚡ NEET Physics Master Dashboard
            </h1>

            <p class="text-slate-400 text-sm mt-1">
                Lecture: 2h • Revision: 35m/lecture • JEE PYQs: 15 Q/hr • NEET PYQs: ~2h/chapter
            </p>
        </div>

        <div class="flex gap-2 flex-wrap">

            <button onclick="exportData()"
            class="bg-sky-500 hover:bg-sky-400 text-slate-950 px-4 py-2 rounded-xl font-bold text-sm">
                Export
            </button>

            <button onclick="resetData()"
            class="bg-red-500/20 hover:bg-red-500/30 text-red-300 border border-red-500/30 px-4 py-2 rounded-xl font-bold text-sm">
                Reset
            </button>

        </div>

    </div>

    <!-- View Selector Tabs -->
    <div class="flex gap-2 border-t border-slate-800 pt-4">
        <button onclick="switchView('net')" id="tab-net"
        class="px-4 py-2 rounded-xl font-bold text-sm transition-all bg-emerald-500 text-slate-950">
            📊 Net Dashboard
        </button>

        <button onclick="switchView('daily')" id="tab-daily"
        class="px-4 py-2 rounded-xl font-bold text-sm transition-all bg-slate-800 text-slate-400 hover:text-white">
            📅 Daily Calendar
        </button>

        <button onclick="switchView('monthly')" id="tab-monthly"
        class="px-4 py-2 rounded-xl font-bold text-sm transition-all bg-slate-800 text-slate-400 hover:text-white">
            🗓️ Monthly Summary
        </button>
    </div>

</header>


<!-- =====================================================
     VIEWS CONTAINER
===================================================== -->

<div id="view-container" class="space-y-6">
    <!-- Rendered dynamically based on active view -->
</div>

</div>


<script>

/* =========================================================
   CHAPTER DATA & STATE
========================================================= */

const chapters = [
    ["Units and Measurements",11,11,181,11,11,181,true],
    ["Vectors & Mathematical Tools",21,21,42,21,21,42,true],
    ["Motion in a Straight Line (1D)",12,12,90,12,12,90,true],
    ["Motion in a Plane (2D)",11,11,87,11,11,87,true],
    ["Laws of Motion",16,16,146,16,16,146,true],
    ["Work, Energy and Power",9,9,103,9,9,103,true],
    ["Center of Mass (COM)",8,8,76,8,0,0,false],
    ["Rotational Motion",12,12,175,12,0,0,false],
    ["Gravitation",7,7,158,7,0,0,false],
    ["Mechanical Properties of Solids",4,4,71,4,0,0,false],
    ["Mechanical Properties of Fluids",11,11,135,9,0,0,false],
    ["Thermal Properties of Matter",9,9,71,9,0,0,false],
    ["Thermodynamics",5,5,107,5,0,0,false],
    ["Kinetic Theory of Gases (KTG)",3,3,111,3,0,0,false],
    ["Oscillations",7,7,105,7,0,0,false],
    ["Waves",6,6,77,6,0,0,false],
    ["Electric Charges and Fields",12,12,129,12,0,0,false],
    ["Electrostatic Potential and Capacitance",12,12,152,9,0,0,false],
    ["Current Electricity",12,12,231,12,0,0,false],
    ["Moving Charges and Magnetism",10,10,134,0,0,0,false],
    ["Magnetism and Matter",3,3,39,0,0,0,false],
    ["Electromagnetic Induction",4,4,112,0,0,0,false],
    ["Alternating Current",7,7,134,0,0,0,false],
    ["Electromagnetic Waves",2,2,114,0,0,0,false],
    ["Ray Optics and Optical Instruments",13,13,194,0,0,0,false],
    ["Wave Optics",5,5,102,5,0,0,false],
    ["Dual Nature of Radiation and Matter",2,2,158,2,0,0,false],
    ["Atoms",3,3,103,3,0,0,false],
    ["Nuclei",2,2,57,2,0,0,false],
    ["Semiconductor Electronics",5,5,140,2,0,0,false]
];

let currentView = "net";

let savedData = localStorage.getItem("neetPhysicsMasterDashboard");
let savedLogs = localStorage.getItem("neetPhysicsMasterLogs");
let savedDailySnapshots = localStorage.getItem("neetPhysicsDailySnapshots");

let data;
let dailyLogs = savedLogs ? JSON.parse(savedLogs) : {};
let dailySnapshots = savedDailySnapshots ? JSON.parse(savedDailySnapshots) : {};

let calendarDate = new Date();
let selectedCalendarDate = getTodayKey();

if(savedData){
    data = JSON.parse(savedData);
} else {
    data = chapters.map(c => ({
        lec: c[4],
        rev: c[5],
        jee: c[6],
        neet: c[7]
    }));
}

function saveData(){
    localStorage.setItem("neetPhysicsMasterDashboard", JSON.stringify(data));
    localStorage.setItem("neetPhysicsMasterLogs", JSON.stringify(dailyLogs));
    localStorage.setItem("neetPhysicsDailySnapshots", JSON.stringify(dailySnapshots));
}

// Custom date key function: shifts day boundary to 3:00 AM
function getTodayKey(){
    const d = new Date();
    if(d.getHours() < 3){
        d.setDate(d.getDate() - 1);
    }
    return d.toISOString().split('T')[0];
}

function checkDailySnapshot(){
    const today = getTodayKey();
    if(!dailySnapshots[today]){
        // If a new day starts, the baseline minimum for today is whatever total progress we had up to this point
        dailySnapshots[today] = JSON.parse(JSON.stringify(data));
    }
}
checkDailySnapshot();

function logActivity(type, delta){
    if(delta === 0) return;
    const today = getTodayKey();
    if(!dailyLogs[today]){
        dailyLogs[today] = { lec: 0, rev: 0, jee: 0, neet: 0 };
    }
    dailyLogs[today][type] += delta;
}


/* =========================================================
   GLOBAL TOTALS HELPER
========================================================= */

function getMasterTotals(){
    let lectureTotal = 0, revisionTotal = 0, jeeTotal = 0, neetTotal = chapters.length;
    chapters.forEach(c => {
        lectureTotal += c[1];
        revisionTotal += c[2];
        jeeTotal += c[3];
    });

    let totalPrepHours = (lectureTotal * 2) + (revisionTotal * (35/60)) + (jeeTotal / 15) + (neetTotal * 2);
    return { lectureTotal, revisionTotal, jeeTotal, neetTotal, totalPrepHours };
}


/* =========================================================
   HELPERS
========================================================= */

function clamp(value, min, max){
    value = Number(value);
    if(isNaN(value)) value = 0;
    return Math.max(min, Math.min(value, max));
}

function percentage(done, total){
    if(total === 0) return 0;
    return (done/total)*100;
}

function formatNumber(number){
    return Number(number).toLocaleString("en-IN", { maximumFractionDigits: 1 });
}

function switchView(view){
    currentView = view;
    ['net', 'daily', 'monthly'].forEach(v => {
        const btn = document.getElementById(`tab-${v}`);
        if(v === view){
            btn.className = "px-4 py-2 rounded-xl font-bold text-sm transition-all bg-emerald-500 text-slate-950";
        } else {
            btn.className = "px-4 py-2 rounded-xl font-bold text-sm transition-all bg-slate-800 text-slate-400 hover:text-white";
        }
    });
    render();
}


/* =========================================================
   UPDATE NUMBERS (PERMANENTLY LOCKED FLOOR)
========================================================= */

function updateValue(index, type, value){
    checkDailySnapshot();
    const today = getTodayKey();
    
    // Find the absolute lowest allowed value (the baseline from the start of today, which includes all past days)
    let baseline = dailySnapshots[today][index][type];
    let max;

    if(type === "lec") max = chapters[index][1];
    else if(type === "rev") max = chapters[index][2];
    else if(type === "jee") max = chapters[index][3];

    let newValue = clamp(value, 0, max);

    if(newValue < baseline){
        alert(`🔒 Locked! You cannot reduce or edit progress completed before today's 3:00 AM cutoff.`);
        render();
        return;
    }

    const oldValue = data[index][type];
    const delta = newValue - oldValue;

    data[index][type] = newValue;
    logActivity(type, delta);

    saveData();
    render();
}

function toggleNeet(index){
    checkDailySnapshot();
    const today = getTodayKey();
    const baselineNeet = dailySnapshots[today][index].neet;
    const currentNeet = data[index].neet;

    if(baselineNeet && !currentNeet){
        alert(`🔒 Locked! This NEET chapter was completed before today's 3:00 AM cutoff and cannot be undone.`);
        return;
    }

    const newStatus = !currentNeet;
    data[index].neet = newStatus;

    const delta = newStatus ? 1 : -1;
    logActivity('neet', delta);

    saveData();
    render();
}

function numberInput(index, type, value, total){
    return `
    <input type="number" min="0" max="${total}" value="${value}"
    onchange="updateValue(${index}, '${type}', this.value)"
    class="w-16 md:w-20 bg-slate-950 border border-slate-700 focus:border-emerald-400 rounded-lg px-2 py-1 text-center text-white">
    `;
}


/* =========================================================
   RENDER ENGINE
========================================================= */

function render(){
    const container = document.getElementById("view-container");

    if(currentView === 'net'){
        container.innerHTML = renderNetDashboard();
    } else if(currentView === 'daily'){
        container.innerHTML = renderDailyDashboard();
    } else if(currentView === 'monthly'){
        container.innerHTML = renderMonthlyDashboard();
    }
}


/* =========================================================
   1. NET DASHBOARD VIEW
========================================================= */

function renderNetDashboard(){
    let lectureDone = 0, lectureTotal = 0;
    let revisionDone = 0, revisionTotal = 0;
    let jeeDone = 0, jeeTotal = 0;
    let neetDone = 0, neetTotal = chapters.length;

    chapters.forEach((chapter, index)=>{
        lectureDone += data[index].lec;
        lectureTotal += chapter[1];
        revisionDone += data[index].rev;
        revisionTotal += chapter[2];
        jeeDone += data[index].jee;
        jeeTotal += chapter[3];
        if(data[index].neet) neetDone++;
    });

    let totalLectureHours = lectureTotal * 2;
    let completedLectureHours = lectureDone * 2;
    let totalRevisionHours = revisionTotal * (35/60);
    let completedRevisionHours = revisionDone * (35/60);
    let totalJEEHours = jeeTotal / 15;
    let completedJEEHours = jeeDone / 15;
    let totalNEETHours = neetTotal * 2;
    let completedNEETHours = neetDone * 2;

    let totalPreparationHours = totalLectureHours + totalRevisionHours + totalJEEHours + totalNEETHours;
    let completedPreparationHours = completedLectureHours + completedRevisionHours + completedJEEHours + completedNEETHours;
    let totalPrepPercentage = (completedPreparationHours / totalPreparationHours) * 100;
    let remainingPreparationHours = totalPreparationHours - completedPreparationHours;

    const metrics = [
        ["🎥 Lectures", percentage(lectureDone, lectureTotal), `${lectureDone}/${lectureTotal}`],
        ["🔄 Revision", percentage(revisionDone, revisionTotal), `${revisionDone}/${revisionTotal}`],
        ["🟣 JEE Main PYQs", percentage(jeeDone, jeeTotal), `${formatNumber(jeeDone)}/${formatNumber(jeeTotal)}`],
        ["🟢 NEET PYQs", percentage(neetDone, neetTotal), `${neetDone}/${neetTotal} chapters`]
    ];

    let remainingLectures = lectureTotal - lectureDone;
    let remainingRevision = revisionTotal - revisionDone;
    let remainingJEE = jeeTotal - jeeDone;
    let remainingNEET = neetTotal - neetDone;

    let timeStats = [
        ["🎥 Lecture", (remainingLectures * 2).toFixed(1)+" h"],
        ["🔄 Revision", (remainingRevision * (35/60)).toFixed(1)+" h"],
        ["🟣 JEE PYQs", (remainingJEE / 15).toFixed(1)+" h"],
        ["🟢 NEET PYQs", (remainingNEET * 2).toFixed(1)+" h"],
        ["🔥 TOTAL", ((remainingLectures * 2) + (remainingRevision * (35/60)) + (remainingJEE / 15) + (remainingNEET * 2)).toFixed(1)+" h"],
        ["Lectures left", remainingLectures],
        ["JEE questions left", formatNumber(remainingJEE)],
        ["NEET chapters left", remainingNEET]
    ];

    let tableRows = chapters.map((chapter, index)=>{
        let d = data[index];
        let complete = d.lec === chapter[1] && d.rev === chapter[2] && d.jee === chapter[3] && d.neet;
        let started = d.lec > 0 || d.rev > 0 || d.jee > 0 || d.neet;
        let status = complete ? 
            `<span class="px-2 py-1 rounded-full bg-emerald-500/20 text-emerald-400">Complete</span>` :
            started ? `<span class="px-2 py-1 rounded-full bg-amber-500/20 text-amber-400">In Progress</span>` :
            `<span class="px-2 py-1 rounded-full bg-slate-800 text-slate-500">Not Started</span>`;

        return `
        <tr class="hover:bg-slate-800/40 transition-colors">
            <td class="p-3 text-center text-slate-500">${index+1}</td>
            <td class="p-3 font-medium">${chapter[0]}</td>
            <td class="p-3 text-center whitespace-nowrap">${numberInput(index, "lec", d.lec, chapter[1])} <span class="text-slate-500">/ ${chapter[1]}</span><div class="text-xs text-slate-500 mt-1">${percentage(d.lec, chapter[1]).toFixed(0)}%</div></td>
            <td class="p-3 text-center whitespace-nowrap">${numberInput(index, "rev", d.rev, chapter[2])} <span class="text-slate-500">/ ${chapter[2]}</span><div class="text-xs text-slate-500 mt-1">${percentage(d.rev, chapter[2]).toFixed(0)}%</div></td>
            <td class="p-3 text-center whitespace-nowrap">${numberInput(index, "jee", d.jee, chapter[3])} <span class="text-slate-500">/ ${chapter[3]}</span><div class="text-xs text-slate-500 mt-1">${percentage(d.jee, chapter[3]).toFixed(0)}%</div></td>
            <td class="p-3 text-center"><button onclick="toggleNeet(${index})" class="px-3 py-1 rounded-lg font-semibold ${d.neet ? "bg-emerald-500/20 text-emerald-400" : "bg-slate-800 text-slate-400"}">${d.neet ? "✓ Done" : "Pending"}</button></td>
            <td class="p-3 text-center text-xs">${status}</td>
        </tr>`;
    }).join("");

    return `
    <div class="bg-gradient-to-r from-emerald-500/20 via-slate-900 to-sky-500/20 border border-emerald-500/30 rounded-2xl p-5 md:p-7 shadow-xl">
        <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-5">
            <div>
                <div class="text-sm uppercase tracking-widest font-bold text-emerald-400">🔥 TOTAL PREPARATION</div>
                <div class="text-5xl md:text-6xl font-black mt-2">${totalPrepPercentage.toFixed(1)}%</div>
                <div class="text-slate-400 mt-2">${completedPreparationHours.toFixed(1)} hours completed / ${totalPreparationHours.toFixed(1)} hours total</div>
            </div>
            <div class="md:w-1/2">
                <div class="flex justify-between text-sm mb-2"><span class="text-slate-400">Overall Progress</span><span class="font-bold text-emerald-400">${totalPrepPercentage.toFixed(1)}%</span></div>
                <div class="h-5 bg-slate-800 rounded-full overflow-hidden">
                    <div class="h-full bg-emerald-400 rounded-full transition-all duration-500" style="width:${Math.min(100, totalPrepPercentage)}%"></div>
                </div>
                <div class="text-xs text-slate-500 mt-2">${remainingPreparationHours.toFixed(1)} hours remaining</div>
            </div>
        </div>
    </div>

    <div class="grid grid-cols-2 lg:grid-cols-4 gap-3">
        ${metrics.map(m => `
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4">
            <div class="text-xs text-slate-400 uppercase font-bold">${m[0]}</div>
            <div class="text-2xl font-black text-emerald-400 mt-1">${m[1].toFixed(1)}%</div>
            <div class="text-xs text-slate-400 mt-1">${m[2]}</div>
            <div class="h-2 bg-slate-800 rounded-full mt-3 overflow-hidden">
                <div class="h-full bg-emerald-400" style="width:${Math.min(100, m[1])}%"></div>
            </div>
        </div>`).join("")}
    </div>

    <div class="grid lg:grid-cols-2 gap-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5">
            <h2 class="font-bold text-lg mb-4 text-emerald-400">📈 Progress</h2>
            <div class="space-y-4">
                ${metrics.map(m => `
                <div>
                    <div class="flex justify-between text-sm"><span>${m[0]}</span><b>${m[1].toFixed(1)}%</b></div>
                    <div class="h-2 bg-slate-800 rounded-full mt-1 overflow-hidden">
                        <div class="h-full bg-sky-400" style="width:${Math.min(100, m[1])}%"></div>
                    </div>
                </div>`).join("")}
            </div>
        </div>
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5">
            <h2 class="font-bold text-lg mb-4 text-emerald-400">⏱️ Remaining Work</h2>
            <div class="grid grid-cols-2 gap-3">
                ${timeStats.map(s => `
                <div class="bg-slate-950 rounded-xl p-3">
                    <span class="text-xs text-slate-500">${s[0]}</span>
                    <div class="font-bold text-lg">${s[1]}</div>
                </div>`).join("")}
            </div>
        </div>
    </div>

    <div class="bg-slate-900 border border-slate-800 rounded-2xl shadow-xl overflow-hidden">
        <div class="p-5 border-b border-slate-800">
            <h2 class="text-lg font-bold text-emerald-400">📚 Chapter Tracker</h2>
            <p class="text-xs text-slate-500 mt-1">Past days are permanently locked at 3:00 AM. You can only increase today's progress.</p>
        </div>
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse text-sm">
                <thead>
                    <tr class="bg-slate-800/60 text-slate-300 uppercase text-xs tracking-wider border-b border-slate-800">
                        <th class="p-3 text-center">#</th>
                        <th class="p-3">Chapter</th>
                        <th class="p-3 text-center">Lectures</th>
                        <th class="p-3 text-center">Revision</th>
                        <th class="p-3 text-center">JEE PYQs</th>
                        <th class="p-3 text-center">NEET PYQs</th>
                        <th class="p-3 text-center">Status</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-slate-800/60">${tableRows}</tbody>
            </table>
        </div>
    </div>`;
}


/* =========================================================
   2. DAILY CALENDAR VIEW
========================================================= */

function changeMonth(direction){
    calendarDate.setMonth(calendarDate.getMonth() + direction);
    render();
}

function selectDay(dateStr){
    selectedCalendarDate = dateStr;
    render();
}

function renderDailyDashboard(){
    const totals = getMasterTotals();
    const year = calendarDate.getFullYear();
    const month = calendarDate.getMonth();

    const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
    const daysOfWeek = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

    const firstDayIndex = new Date(year, month, 1).getDay();
    const totalDays = new Date(year, month + 1, 0).getDate();

    let calendarCells = "";

    for(let i = 0; i < firstDayIndex; i++){
        calendarCells += `<div class="bg-slate-950/40 rounded-xl p-2 min-h-[85px] opacity-30"></div>`;
    }

    for(let day = 1; day <= totalDays; day++){
        const mStr = String(month + 1).padStart(2, '0');
        const dStr = String(day).padStart(2, '0');
        const dateStr = `${year}-${mStr}-${dStr}`;

        const log = dailyLogs[dateStr];
        const isSelected = (dateStr === selectedCalendarDate);
        const isToday = (dateStr === getTodayKey());

        let hasActivity = false;
        let dayHours = 0;
        let dayPercentage = 0;

        if(log){
            dayHours = (log.lec * 2) + (log.rev * (35/60)) + (log.jee / 15) + (log.neet * 2);
            if(dayHours > 0){
                hasActivity = true;
                dayPercentage = (dayHours / totals.totalPrepHours) * 100;
            }
        }

        let borderClass = "border-slate-800";
        if(isSelected) borderClass = "border-emerald-400 ring-2 ring-emerald-400/40";
        else if(isToday) borderClass = "border-sky-500/50";

        calendarCells += `
        <div onclick="selectDay('${dateStr}')" 
        class="bg-slate-950 border ${borderClass} rounded-xl p-2.5 min-h-[90px] flex flex-col justify-between cursor-pointer hover:border-emerald-400/60 transition-all">
            <div class="flex justify-between items-center">
                <span class="text-xs font-bold ${isToday ? 'bg-sky-500 text-slate-950 px-1.5 py-0.5 rounded-md' : 'text-slate-400'}">${day}</span>
                ${hasActivity ? `<span class="w-2 h-2 rounded-full bg-emerald-400"></span>` : ``}
            </div>
            <div>
                ${hasActivity ? `
                <div class="text-[11px] text-emerald-400 font-black truncate">+${dayPercentage.toFixed(2)}%</div>
                <div class="text-[9px] text-slate-400 truncate">${dayHours.toFixed(1)} hrs</div>
                ` : `
                <div class="text-[10px] text-slate-600">-</div>
                `}
            </div>
        </div>`;
    }

    const selectedLog = dailyLogs[selectedCalendarDate] || { lec: 0, rev: 0, jee: 0, neet: 0 };
    const selLecPct = (selectedLog.lec / totals.lectureTotal) * 100;
    const selRevPct = (selectedLog.rev / totals.revisionTotal) * 100;
    const selJeePct = (selectedLog.jee / totals.jeeTotal) * 100;
    const selNeetPct = (selectedLog.neet / totals.neetTotal) * 100;
    const selHours = (selectedLog.lec * 2) + (selectedLog.rev * (35/60)) + (selectedLog.jee / 15) + (selectedLog.neet * 2);
    const selTotalPct = (selHours / totals.totalPrepHours) * 100;

    return `
    <div class="space-y-6">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
                <h2 class="text-lg font-bold text-emerald-400">📅 Daily Calendar Tracker</h2>
                <p class="text-xs text-slate-500 mt-0.5">Click any day on the calendar to inspect your exact daily output.</p>
            </div>
            <div class="flex items-center gap-3 bg-slate-950 px-4 py-2 rounded-xl border border-slate-800">
                <button onclick="changeMonth(-1)" class="text-emerald-400 hover:text-emerald-300 font-bold px-2 py-1">&larr; Prev</button>
                <span class="font-bold text-sm min-w-[120px] text-center">${monthNames[month]} ${year}</span>
                <button onclick="changeMonth(1)" class="text-emerald-400 hover:text-emerald-300 font-bold px-2 py-1">Next &rarr;</button>
            </div>
        </div>

        <!-- Calendar Grid -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 md:p-6 shadow-xl space-y-4">
            <div class="grid grid-cols-7 gap-2 text-center">

                    <span class="text-xs uppercase text-slate-500 font-bold tracking-wider">Selected Date Inspection</span>

                </div>
                <span class="text-xs font-semibold px-3 py-1 bg-emerald-500/20 text-emerald-400 rounded-full">
                    +${selTotalPct.toFixed(2)}% Total Syllabus Done

}


/* =========================================================
   3. MONTHLY VIEW
========================================================= */

function renderMonthlyDashboard(){
    const monthlyMap = {};
    const totals = getMasterTotals();

    Object.keys(dailyLogs).forEach(dateStr => {
        const monthKey = dateStr.substring(0, 7);
        if(!monthlyMap[monthKey]){
            monthlyMap[monthKey] = { lec: 0, rev: 0, jee: 0, neet: 0 };
        }
        monthlyMap[monthKey].lec += dailyLogs[dateStr].lec;
        monthlyMap[monthKey].rev += dailyLogs[dateStr].rev;
        monthlyMap[monthKey].jee += dailyLogs[dateStr].jee;
        monthlyMap[monthKey].neet += dailyLogs[dateStr].neet;
    });

    const months = Object.keys(monthlyMap).sort().reverse();

    if(months.length === 0){
        return `
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-8 text-center space-y-3">
            <div class="text-4xl">🗓️</div>
            <h2 class="text-xl font-bold text-emerald-400">No Monthly Activity Logged Yet</h2>
            <p class="text-slate-400 text-sm">Your monthly totals and percentage contributions will automatically accumulate here.</p>
        </div>`;
    }

    return `
    <div class="space-y-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5">
            <h2 class="text-lg font-bold text-emerald-400 mb-1">🗓️ Monthly Summary</h2>
            <p class="text-xs text-slate-500">Aggregated preparation output and percentage shares grouped by month.</p>
        </div>

        <div class="grid md:grid-cols-2 gap-4">
            ${months.map(m => {
                const stat = monthlyMap[m];
                const lecPct = (stat.lec / totals.lectureTotal) * 100;
                const revPct = (stat.rev / totals.revisionTotal) * 100;
                const jeePct = (stat.jee / totals.jeeTotal) * 100;
                const neetPct = (stat.neet / totals.neetTotal) * 100;

                const monthHours = (stat.lec * 2) + (stat.rev * (35/60)) + (stat.jee / 15) + (stat.neet * 2);
                const monthTotalPct = (monthHours / totals.totalPrepHours) * 100;

                return `
                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4">
                    <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                        <span class="font-bold text-emerald-400 text-lg">${m}</span>
                        <span class="text-xs font-semibold px-2.5 py-1 bg-emerald-500/20 text-emerald-400 rounded-full">
                            +${monthTotalPct.toFixed(2)}% Overall Progress
                        </span>
                    </div>

                    <div class="grid grid-cols-2 gap-3 text-sm">
                        <div class="bg-slate-950 p-3 rounded-xl space-y-1">
                            <div class="text-xs text-slate-500">Lectures Completed</div>
                            <div class="text-lg font-bold text-white">${stat.lec}</div>
                            <div class="text-xs text-emerald-400 font-medium">${lecPct.toFixed(2)}% of total</div>
                        </div>

                        <div class="bg-slate-950 p-3 rounded-xl space-y-1">
                            <div class="text-xs text-slate-500">Revisions Completed</div>
                            <div class="text-lg font-bold text-white">${stat.rev}</div>
                            <div class="text-xs text-emerald-400 font-medium">${revPct.toFixed(2)}% of total</div>
                        </div>

                        <div class="bg-slate-950 p-3 rounded-xl space-y-1">
                            <div class="text-xs text-slate-500">JEE PYQs Solved</div>
                            <div class="text-lg font-bold text-white">${formatNumber(stat.jee)}</div>
                            <div class="text-xs text-emerald-400 font-medium">${jeePct.toFixed(2)}% of total</div>
                        </div>

                        <div class="bg-slate-950 p-3 rounded-xl space-y-1">
                            <div class="text-xs text-slate-500">NEET Chapters Completed</div>
                            <div class="text-lg font-bold text-white">${stat.neet}</div>
                            <div class="text-xs text-emerald-400 font-medium">${neetPct.toFixed(2)}% of total</div>
                        </div>
                    </div>
                </div>`;
            }).join("")}
        </div>
    </div>`;
}


/* =========================================================
   RESET & EXPORT
========================================================= */

function resetData(){
    if(!confirm("Reset the dashboard and logs to your original starting progress?")){
        return;
    }
    data = chapters.map(chapter => ({
        lec: chapter[4],
        rev: chapter[5],
        jee: chapter[6],
        neet: chapter[7]
    }));
    dailyLogs = {};
    dailySnapshots = {};
    saveData();
    render();
}

function exportData(){
    const exportBundle = { data, dailyLogs, dailySnapshots };
    const file = new Blob([JSON.stringify(exportBundle, null, 2)], { type: "application/json" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(file);
    link.download = "NEET-Physics-Progress-Backup.json";
    link.click();
}


/* =========================================================
   START DASHBOARD
========================================================= */

render();

</script>
